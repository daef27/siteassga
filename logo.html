<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar logo e favicon | ASSGA</title>
    <link rel="icon" href="src/imagens/Assga_foto.jpg" type="image/jpeg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="src/brand.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; font-family: 'Segoe UI', Tahoma, sans-serif; color: #102a43; background: radial-gradient(circle at top right, #dbe9f8, #f5f8fb 52%); }
        header { padding: 18px max(20px, calc((100% - 980px) / 2)); display: flex; justify-content: space-between; gap: 16px; background: #003366; color: #fff; }
        header h1 { margin: 0; font-size: 1.25rem; } header a { color: #fff; text-decoration: none; font-size: .9rem; }
        main { width: min(980px, calc(100% - 32px)); margin: 32px auto; } h2 { color: #003366; margin-bottom: 6px; } .intro p { color: #52606d; margin-top: 0; }
        .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; margin-top: 22px; }
        .panel { background: #fff; border: 1px solid #d9e2ec; border-radius: 14px; padding: 22px; box-shadow: 0 12px 30px rgba(0,51,102,.08); }
        .panel h3 { margin: 0 0 16px; color: #003366; font-size: 1.05rem; } .preview { height: 210px; display: grid; place-items: center; background: #f5f7fa; border: 1px dashed #bcccdc; border-radius: 10px; margin-bottom: 16px; overflow: hidden; }
        .preview img { max-width: 82%; max-height: 82%; object-fit: contain; } label { display: block; font-weight: 700; font-size: .9rem; margin-bottom: 7px; } input { width: 100%; }
        .hint { color: #627d98; font-size: .8rem; line-height: 1.4; } .actions { display: flex; align-items: center; gap: 14px; margin-top: 22px; }
        button { border: 0; border-radius: 8px; padding: 12px 18px; background: #007c91; color: #fff; font-weight: 700; cursor: pointer; } button:hover { background: #005f6f; } #status { color: #147d64; font-weight: 700; }
        @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } header { flex-direction: column; } }
    </style>
</head>
<body>
    <header><h1><i class="fas fa-palette"></i> Gerenciar marca do site</h1><a href="admin.html"><i class="fas fa-arrow-left"></i> Voltar ao painel</a></header>
    <main>
        <div class="intro"><h2>Logo e favicon</h2><p>As imagens escolhidas serão usadas automaticamente em todas as páginas neste navegador.</p></div>
        <form id="brandForm"><div class="grid">
            <section class="panel"><h3><i class="fas fa-image"></i> Logo principal</h3><div class="preview"><img id="logoPreview" src="src/imagens/Assga_foto.jpg" alt="Pré-visualização da logo"></div><label for="logoFile">Escolher imagem da logo</label><input id="logoFile" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml"><p class="hint">PNG, JPG, WEBP ou SVG, com no máximo 4 MB.</p></section>
            <section class="panel"><h3><i class="fas fa-window-maximize"></i> Favicon</h3><div class="preview"><img id="faviconPreview" src="src/imagens/Assga_foto.jpg" alt="Pré-visualização do favicon"></div><label for="faviconFile">Escolher imagem do favicon</label><input id="faviconFile" type="file" accept="image/png,image/jpeg,image/webp,image/x-icon,image/svg+xml"><p class="hint">Use uma imagem quadrada para melhor resultado na aba do navegador.</p></section>
        </div><div class="actions"><button type="submit"><i class="fas fa-save"></i> Salvar marca</button><span id="status" role="status"></span></div></form>
    </main>
    <script>
        if (sessionStorage.getItem('assga_admin_autenticado') !== 'true') window.location.href = 'admin.html';
        const fallback = 'src/imagens/Assga_foto.jpg';
        const getConfig = () => JSON.parse(localStorage.getItem('assga_config') || '{}');
        const logoFile = document.getElementById('logoFile'); const faviconFile = document.getElementById('faviconFile'); const brandForm = document.getElementById('brandForm'); const statusMessage = document.getElementById('status');
        const config = getConfig(); let selectedLogo = config.logoImg || ''; let selectedFavicon = config.faviconImg || '';
        if (selectedLogo) logoPreview.src = selectedLogo; if (selectedFavicon) faviconPreview.src = selectedFavicon;
        function readImage(file, callback) { if (!file) return; if (file.size > 4 * 1024 * 1024) return alert('A imagem deve ter no máximo 4 MB.'); const reader = new FileReader(); reader.onload = () => callback(reader.result); reader.readAsDataURL(file); }
        logoFile.addEventListener('change', function () { readImage(this.files[0], data => { selectedLogo = data; logoPreview.src = data; }); });
        faviconFile.addEventListener('change', function () { readImage(this.files[0], data => { selectedFavicon = data; faviconPreview.src = data; }); });
        brandForm.addEventListener('submit', function (event) { event.preventDefault(); localStorage.setItem('assga_config', JSON.stringify({ ...getConfig(), logoImg: selectedLogo, faviconImg: selectedFavicon || selectedLogo || fallback })); statusMessage.textContent = 'Marca salva com sucesso.'; });
    </script>
</body>
</html>
